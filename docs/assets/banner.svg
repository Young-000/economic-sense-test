<svg width="1932" height="828" viewBox="0 0 1932 828" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1932" height="828" rx="24" fill="#10B981"/>

  <!-- Subtle pattern overlay -->
  <rect width="1932" height="828" rx="24" fill="url(#bannerGradient)" opacity="0.3"/>

  <defs>
    <linearGradient id="bannerGradient" x1="0" y1="0" x2="1932" y2="828">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#34D399"/>
    </linearGradient>
  </defs>

  <!-- Chart icon (rising graph) -->
  <g transform="translate(200, 200)">
    <!-- Chart background -->
    <rect x="0" y="0" width="400" height="400" rx="20" fill="white" opacity="0.15"/>
    <!-- Chart bars -->
    <rect x="50" y="280" width="60" height="80" rx="8" fill="white" opacity="0.8"/>
    <rect x="130" y="220" width="60" height="140" rx="8" fill="white" opacity="0.85"/>
    <rect x="210" y="160" width="60" height="200" rx="8" fill="white" opacity="0.9"/>
    <rect x="290" y="80" width="60" height="280" rx="8" fill="white" opacity="0.95"/>
    <!-- Rising arrow -->
    <path d="M60 260 L150 200 L240 140 L330 60" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" fill="none"/>
    <polygon points="330,40 350,70 310,70" fill="#fbbf24"/>
  </g>

  <!-- Won symbol -->
  <text x="750" y="380" font-family="Arial, sans-serif" font-size="200" font-weight="bold" fill="white" opacity="0.2">
    ₩
  </text>

  <!-- Main text -->
  <text x="966" y="350" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="120" font-weight="800" fill="white">
    경제 센스 테스트
  </text>

  <!-- Subtitle -->
  <text x="966" y="460" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="52" font-weight="500" fill="white" opacity="0.85">
    당신의 투자 감각을 시험해보세요
  </text>

  <!-- Decorative sparkles -->
  <circle cx="1600" cy="200" r="16" fill="#fbbf24" opacity="0.7"/>
  <circle cx="1700" cy="350" r="10" fill="white" opacity="0.5"/>
  <circle cx="1650" cy="550" r="12" fill="#fbbf24" opacity="0.6"/>
  <circle cx="1500" cy="650" r="8" fill="white" opacity="0.4"/>

  <!-- Bottom tagline -->
  <text x="966" y="700" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="36" font-weight="400" fill="white" opacity="0.6">
    앱인토스
  </text>
</svg>
